<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Davs Editor | Portafolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #131926;
            --accent-cyan: #00f2fe;
            --accent-purple: #9d4edd;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; position: relative; min-height: 100vh; }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        
        header { position: sticky; top: 0; width: 100%; background: rgba(11, 15, 23, 0.95); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem; position: relative; }
        .logo { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        
        .menu-toggle { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); padding: 0.5rem 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .menu-toggle svg { width: 24px; height: 24px; fill: var(--text-main); }
        
        .nav-links { position: absolute; top: 100%; left: 0; width: 100%; background: rgba(11, 15, 23, 0.98); flex-direction: column; padding: 1.5rem; gap: 1.2rem; border-bottom: 1px solid var(--border-color); display: none; list-style: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .nav-links.active { display: flex; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 1rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-cyan); }
        
        .btn-primary { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); color: #000; font-weight: 700; padding: 0.75rem 1.2rem; border-radius: 50px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border: none; cursor: pointer; font-size: 0.95rem; }
        
        .content-section { position: relative; z-index: 1; padding: 3rem 1rem 3rem; max-width: 1200px; margin: 0 auto; }
        
        /* Título principal "Portafolio" con el color del logo */
        .section-title { 
            text-align: center; 
            font-size: 2.3rem; 
            margin-bottom: 2.3rem; 
            font-weight: 800; 
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        /* Subtítulo "Formatos cortos" más pequeño */
        .section-category {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.3rem;
        }

        .section-subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
        
        /* Carrusel Horizontal */
        .slider-container {
            display: flex;
            gap: 1.2rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) var(--card-bg);
            -webkit-overflow-scrolling: touch;
        }
        
        .slider-container::-webkit-scrollbar { height: 6px; }
        .slider-container::-webkit-scrollbar-track { background: var(--card-bg); border-radius: 4px; }
        .slider-container::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }

        .portfolio-card {
            flex: 0 0 260px;
            scroll-snap-align: start;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-wrapper {
            width: 100%;
            height: 420px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 769px) {
            .menu-toggle { display: none; }
            .nav-container { padding: 1rem 2rem; }
            .nav-links { position: static; display: flex !important; flex-direction: row; width: auto; background: none; padding: 0; gap: 2rem; border: none; box-shadow: none; }
            .portfolio-card { flex: 0 0 300px; }
            .video-wrapper { height: 480px; }
            .content-section { padding: 4rem 1rem 4rem; }
            header { position: fixed; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Davs Editor</a>
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir Menú">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="portafolio.html" class="active">Portafolio</a></li>
                <li><a href="sobre-mi.html">Sobre mí</a></li>
                <li><a href="https://wa.me/528126456994?text=Hola,%20me%20gustaría%20cotizar%20un%20proyecto." target="_blank" class="btn-primary" style="color: #ffffff;" >Hablar por WhatsApp</a></li>
            </ul>
        </div>
    </header>

    <div class="content-section">
        <h2 class="section-title">Portafolio</h2>
        <h3 class="section-category">Formatos cortos</h3>
        <p class="section-subtitle">Desliza para ver ejemplos de edición dinámica orientada a retención y viralidad.</p>

        <div class="slider-container">
            <!-- Video 1 -->
            <div class="portfolio-card">
                <div class="video-wrapper">
                    <video controls preload="metadata" playsinline>
                        <source src="videos/video1.mp4" type="video/mp4">
                        Tu navegador no soporta video.
                    </video>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="portfolio-card">
                <div class="video-wrapper">
                    <video controls preload="metadata" playsinline>
                        <source src="videos/video2.mp4" type="video/mp4">
                        Tu navegador no soporta video.
                    </video>
                </div>
            </div>

            <!-- Video 3 -->
            <div class="portfolio-card">
                <div class="video-wrapper">
                    <video controls preload="metadata" playsinline>
                        <source src="videos/video3.mp4" type="video/mp4">
                        Tu navegador no soporta video.
                    </video>
                </div>
            </div>

            <!-- Video 4 -->
            <div class="portfolio-card">
                <div class="video-wrapper">
                    <video controls preload="metadata" playsinline>
                        <source src="videos/video4.mp4" type="video/mp4">
                        Tu navegador no soporta video.
                    </video>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks = document.getElementById('nav-links');
        menuToggle.addEventListener('click', () => navLinks.classList.toggle('active'));
        
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        
        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, alpha: Math.random() * 0.5 + 0.2 });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`; ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
